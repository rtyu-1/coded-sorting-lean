name: Lean verification

on:
  push:
    branches: [main, public-release, 'public-release-*']
  pull_request:
    branches: [main, public-release, 'public-release-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and audit paper theorems
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    defaults:
      run:
        shell: bash
        working-directory: lean
    steps:
      - name: Check out the submitted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record the checked revision
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/commit.txt
          cp lean-toolchain lake-manifest.json reports/

      - name: Check documentation and source layout
        run: python3 scripts/check_release.py

      - name: Install Lean, restore caches and build
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "true"

      - name: Verify Theorems 3.1 and 3.2 and their axioms
        run: python3 scripts/verify.py

      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean/reports/
          if-no-files-found: warn
          retention-days: 30
